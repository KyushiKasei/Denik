<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3d5a40" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Památky" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("pamatky-theme");
          var dark =
            t === "dark" ||
            (t !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1a1814" : "#3d5a40");
          var bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (bar) bar.setAttribute("content", dark ? "black-translucent" : "default");
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Osobní katalog hradů, zámků a historických míst. Funguje i bez sítě po nahrání catalog.json."
    />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Památky</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
