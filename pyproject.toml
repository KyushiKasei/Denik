[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pamatky-denik"
version = "0.1.0"
description = "Lokální katalog historických míst a cestovatelský deník"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "uuid-utils>=0.10.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "segno>=1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["pc-app"]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/**/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["pc-app/tests"]
